<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PulseChat — Realtime Chat</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient background glow effects -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- Login Section -->
  <section id="login" class="card">
    <div class="brand">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          <path d="M8 10h.01"></path>
          <path d="M12 10h.01"></path>
          <path d="M16 10h.01"></path>
        </svg>
      </div>
      <h1>PulseChat</h1>
      <p class="subtitle">Realtime Multi-Room Experience</p>
    </div>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">Display Name</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input id="username" placeholder="e.g. Alex" maxlength="20" required autocomplete="off" />
        </div>
      </div>

      <div class="input-group">
        <label for="room">Room Name</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>
          <input id="room" placeholder="general" maxlength="30" list="roomOptions" autocomplete="off" />
        </div>
        <datalist id="roomOptions"></datalist>
      </div>

      <button type="submit" class="btn-primary">
        <span>Join Room</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
      <p id="loginError" class="error"></p>
    </form>

    <div class="active-rooms-container">
      <span class="section-label">Active Public Rooms</span>
      <div id="activeRooms" class="rooms-chips"></div>
    </div>
  </section>

  <!-- Main Chat Section -->
  <section id="chat" class="hidden">
    <!-- Top Mobile Header -->
    <header class="chat-mobile-header">
      <div class="mobile-room-info">
        <span class="hash">#</span>
        <span id="mobileRoomTitle">general</span>
      </div>
      <button id="toggleSidebarBtn" class="icon-btn" aria-label="Toggle Online Users">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      </button>
    </header>

    <!-- Sidebar -->
    <aside id="chatSidebar">
      <div class="sidebar-header">
        <div class="room-badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>
          <h2 id="roomTitle"># general</h2>
        </div>
      </div>

      <div class="sidebar-users">
        <div class="users-title">
          <span>ONLINE MEMBERS</span>
          <span id="userCount" class="count-badge">0</span>
        </div>
        <ul id="users"></ul>
      </div>

      <div class="sidebar-footer">
        <button id="leaveBtn" class="btn-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Leave Room</span>
        </button>
      </div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>

    <!-- Chat Messages & Input Area -->
    <main class="chat-main">
      <div class="chat-header-desktop">
        <div class="status-indicator">
          <span class="pulse-dot"></span>
          <span>Live Connection</span>
        </div>
      </div>

      <ul id="messages"></ul>

      <div id="typing" class="typing-container"></div>

      <div class="input-area">
        <form id="msgForm">
          <input id="msgInput" placeholder="Write a message..." autocomplete="off" maxlength="500" />
          <button type="submit" class="btn-send" aria-label="Send Message">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </form>
        <p id="msgError" class="error"></p>
      </div>
    </main>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
